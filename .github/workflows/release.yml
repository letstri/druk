name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  # package.json is the single source of the version: the published shim fetches its
  # binaries from `releases/download/v${version}`, so the release has to carry that
  # exact tag. A tag push disagreeing with package.json would upload the binaries to
  # one release while the shim fetched from another — the same broken install as no
  # release at all. Fail in ten seconds rather than after five runners have built.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=v$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One runner per platform: cross-compiling needs the target's @opentui/core-<platform>
  # package, and `bun install` only fetches the host's.
  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          # The last Intel image Actions offers: macos-13 was retired in December
          # 2025, and x86_64 goes away entirely when this one retires in 2027.
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: linux-x64
            os: ubuntu-latest
          - target: windows-x64
            os: windows-latest
          # Same runners as their AVX2 siblings — a baseline build wants the same
          # @opentui/core-<platform> package, so this is the one cross-compile that
          # works. For CPUs without AVX2, which Bun's default x64 builds require.
          - target: linux-x64-baseline
            os: ubuntu-latest
          - target: windows-x64-baseline
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: druk-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    # Every run of this job ships, by a tag push or by hand. Nothing here may be made
    # conditional on its own: the npm publish once carried no guard while the release
    # upload did, so a run published a package whose binaries were never uploaded
    # anywhere and every `npm i druk` fetched a 404. Both steps go together.
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Node is here for `npm publish` alone — provenance is an npm feature.
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: druk-*
      # download-artifact names each directory after the artifact; release.ts wants
      # dist/<target>/druk.
      - run: |
          cd dist
          for dir in druk-*; do mv "$dir" "${dir#druk-}"; done
          chmod +x */druk || true
      - run: bun run release
      # After `bun run release`, which clears dist/release before it writes the archives,
      # and before the upload — formula.ts checksums those archives, builds the bottles
      # brew pours from the binaries in dist/<target>/, and drops druk.rb in beside them,
      # so the `dist/release/*` glob below carries all of it to the release without naming
      # anything. Attaching the formula is what lets the tap job stay a plain file copy,
      # and it leaves a hand-installable formula on every release even when no tap exists.
      #
      # The bottles have to be assets of *this* release: the formula's `root_url` points
      # at it, and a release missing them sends every `brew install` back to a source
      # build — which is what fails on a machine whose Xcode trails its macOS (issue #40).
      - run: bun run formula
      # nfpm turns the linux binaries into .deb/.rpm files in dist/release/, which
      # the upload below carries like everything else there. Pinned by version and
      # by the tarball's SHA-256 as a literal here — a checksum fetched from the
      # same origin as the artifact would verify nothing. The fetch is a hard
      # dependency of the release on purpose: `druk update` points system installs
      # at these assets, so a release shipped without them is the same
      # published-pointer-to-nothing failure the npm and upload steps refuse to
      # allow each other. Re-running a shipped version stays safe, and a yanked
      # tarball is a one-line pin bump.
      - name: Package for deb and rpm
        run: |
          curl -fsSL -o nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm
          sudo mv nfpm /usr/local/bin/nfpm
          rm nfpm.tar.gz
          bun run packages
      # git, not `gh release create --target`: GITHUB_TOKEN may create a release for a
      # tag that already exists, but creating one that has to create the tag too comes
      # back `403 Resource not accessible by integration`. Pushing the tag over the
      # checkout's own credentials is plain `contents: write` and works, so a manual
      # run tags the commit here and the release step then finds the tag waiting.
      #
      # A tag push arrives with it already on the remote, and re-running a shipped
      # version reuses the tag it finds rather than moving it — the assets are
      # replaced below, and npm skips a version already on the registry.
      - name: Tag this commit
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "$VERSION is already tagged — reusing it"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
      # Before npm, not after: the published package holds no binary and fetches one
      # from this release, so an install landing between the two would find nothing.
      - name: Publish the release with the binaries
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 \
            || gh release create "$VERSION" --title "$VERSION" --generate-notes
          gh release upload "$VERSION" dist/release/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # No NODE_AUTH_TOKEN: npm authenticates through OIDC, using the trusted publisher
      # configured for `druk`. An empty token would be worse than none — setup-node
      # writes it into .npmrc and npm then fails with ENEEDAUTH before it ever reaches
      # the OIDC exchange. A version already on the registry is skipped by release.ts,
      # so re-running a shipped version is not an error.
      - name: Publish to npm
        run: bun run release --publish
        env:
          NPM_CONFIG_PROVENANCE: true

  # Homebrew installs come from letstri/homebrew-tap, and a formula there is the whole of
  # what `brew install letstri/tap/druk` reads — so shipping a version means copying
  # druk.rb from the release into that repository.
  #
  # It is a separate job because it authenticates differently from everything above.
  # GITHUB_TOKEN is scoped to this repository and cannot write to another one, and there
  # is no OIDC trusted-publisher arrangement for a git push the way npm has one, so this
  # is the single step of the release that needs a stored credential: TAP_TOKEN, a
  # fine-grained PAT with contents:write on letstri/homebrew-tap alone.
  #
  # Skipping without it is deliberate, and is not the conditional the publish job warns
  # about. Those two steps are conditional on *each other* — a package published without
  # its release fetches a 404 — whereas nothing downstream reads the tap. A formula that
  # was not updated leaves brew a version behind, which is stale, not broken, and every
  # other channel still shipped. That is the right failure for a repository that cannot
  # hold the secret: forks, and this one until the tap exists, release exactly as before.
  tap:
    needs: [check, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # `secrets` is not a context `if:` can read; mapping it here and testing the env
      # var is how a step conditions on a secret's presence.
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: Check out the tap
        if: env.TAP_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: letstri/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
      - name: Update Formula/druk.rb
        if: env.TAP_TOKEN != ''
        # The formula the release already carries, not one regenerated here: it was
        # checksummed against the archives that were actually uploaded, and rebuilding it
        # would need every binary downloaded again to say the same thing.
        run: |
          mkdir -p Formula
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern druk.rb --dir Formula --clobber
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/druk.rb
          # Re-running a shipped version is safe everywhere else in this workflow; an
          # unchanged formula is that case reaching here, and `git commit` would fail on
          # an empty tree rather than no-op.
          if git diff --cached --quiet; then
            echo "Formula/druk.rb is already at $VERSION"
          else
            git commit -m "druk $VERSION"
            git push
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Say the formula was not published
        if: env.TAP_TOKEN == ''
        run: |
          echo "::notice::TAP_TOKEN is not set — skipping the Homebrew tap update." \
            "druk.rb is attached to release $VERSION and can be copied to" \
            "letstri/homebrew-tap as Formula/druk.rb by hand."
